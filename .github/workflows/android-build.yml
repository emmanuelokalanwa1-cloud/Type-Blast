name: Build Signed Android AAB

# Manual trigger (Actions tab -> this workflow -> Run workflow) or every
# push to main. Produces a signed .aab ready to upload to Play Console.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7-stable
  GODOT_TEMPLATE_DIR: 4.7.stable   # local template folder Godot expects (dot before "stable")
  EXPORT_PRESET: Android
  EXPORT_NAME: typeblast-release.apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Godot editor + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            godot_bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot editor + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot_bin
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d godot_bin
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -q templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      - name: Locate Godot binary
        run: |
          BIN=$(find godot_bin -maxdepth 1 -type f -iname "Godot_v*")
          echo "GODOT_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          chmod +x "$PWD/$BIN"

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Import project resources
        run: $GODOT_BIN --headless --import

      - name: Install Android build template + export signed AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cp "$RUNNER_TEMP/release.keystore" "$GITHUB_WORKSPACE/release.keystore"
          mkdir -p build
          "$GODOT_BIN" --headless --verbose --install-android-build-template \
            --export-release "${EXPORT_PRESET}" "build/${EXPORT_NAME}"
          rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: typeblast-release-aab
          path: build/${{ env.EXPORT_NAME }}
          retention-days: 30
